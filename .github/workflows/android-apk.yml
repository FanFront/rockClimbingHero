name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      target_abi:
        description: 'Android CPU target (ARM64 for modern phones; all for universal APK)'
        required: true
        default: arm64-v8a
        type: choice
        options:
          - arm64-v8a
          - all
  push:
    branches: [android-build-validation]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # No package-lock.json yet: cache npm download artifacts keyed by package.json.
      # Do not use setup-node "cache: npm" or npm ci without a committed lockfile.
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Generate Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --no-install

      # Run after prebuild because the Gradle wrapper is generated by Expo.
      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@v6

      - name: Build installable release APK
        working-directory: android
        env:
          TARGET_ABI: ${{ inputs.target_abi || 'arm64-v8a' }}
        run: |
          chmod +x gradlew
          if [ "$TARGET_ABI" = "all" ]; then
            echo "Building universal APK (all Android ABIs)"
            ./gradlew :app:assembleRelease --no-daemon --build-cache
          else
            echo "Building ARM64 APK only"
            ./gradlew :app:assembleRelease --no-daemon --build-cache -PreactNativeArchitectures=arm64-v8a
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rock-climbing-hero-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
